name: Update CAD Submodule

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Better_Desk
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Get latest CAD commit
        id: cad
        run: |
          CAD_COMMIT=$(git ls-remote https://github.com/eshantsonhar/Betterdesk---cad-model.git refs/heads/main | cut -f1)
          echo "commit=$CAD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest CAD commit: $CAD_COMMIT"

      - name: Update submodule pointer
        run: |
          git update-index --add --cacheinfo 160000,${{ steps.cad.outputs.commit }},cad_files_and_step

          if git diff --cached --quiet; then
            echo "CAD submodule is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Automatically update CAD submodule"
          git push
